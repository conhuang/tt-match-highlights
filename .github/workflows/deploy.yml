name: Deploy to EC2 Instance

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    
    env:
      AWS_REGION: us-east-2                  
      ECR_REPOSITORY: tt_video_editor        
      EC2_INSTANCE_ID: i-0ddbb277eaf3c1889

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU & Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag, and Push ARM64 Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .

      - name: Deploy to EC2 Server via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 475632990529.dkr.ecr.us-east-2.amazonaws.com",
              "docker pull 475632990529.dkr.ecr.us-east-2.amazonaws.com/tt_video_editor:latest",
              "docker stop tt_app || true",
              "docker rm tt_app || true",
              "docker run -d --name tt_app --restart always -p 8000:80 -e STORAGE_TYPE=s3 -e S3_BUCKET_NAME=tt-video-editor-storage -e DB_TYPE=dynamodb -e DYNAMODB_TABLE_NAME=tt_video_editor_matches -e AWS_REGION=us-east-2 475632990529.dkr.ecr.us-east-2.amazonaws.com/tt_video_editor:latest"
            ]' \
            --region ${{ env.AWS_REGION }}

