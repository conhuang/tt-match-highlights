name: Deploy to EC2 Instance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest httpx
          pip install --no-deps -e .

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/

  deploy:
    name: Build & Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: tt_video_editor
      EC2_INSTANCE_ID: i-0ddbb277eaf3c1889

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU & Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag, and Push ARM64 Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .

      - name: Deploy to EC2 Server via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 475632990529.dkr.ecr.us-east-2.amazonaws.com",
              "docker image prune -a -f",
              "docker pull 475632990529.dkr.ecr.us-east-2.amazonaws.com/tt_video_editor:latest",
              "docker stop tt_app || true",
              "docker rm tt_app || true",
              "docker run -d --name tt_app --restart always -p 80:8000 -e STORAGE_TYPE=s3 -e S3_BUCKET_NAME=tt-video-editor-storage-test -e DATABASE_TYPE=dynamodb -e DYNAMODB_TABLE_NAME=tt_video_editor_matches_dev -e AWS_REGION=us-east-2 -e GIT_COMMIT_SHA=${{ github.sha }} 475632990529.dkr.ecr.us-east-2.amazonaws.com/tt_video_editor:latest"
            ]' \
            --region ${{ env.AWS_REGION }}

