name: Deploy to EC2 Instance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest httpx
          pip install --no-deps -e .

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/

  deploy:
    name: Build & Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: tt_video_editor
      EC2_INSTANCE_ID: i-0ddbb277eaf3c1889

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag, and Push ARM64 Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Deploy to EC2 Server via AWS SSM & Verify Success
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          S3_BUCKET_NAME: "tt-video-editor-storage"
          DYNAMODB_TABLE_NAME: "tt_video_editor_matches"
          ALLOWED_BETA_EMAILS: ${{ vars.ALLOWED_BETA_EMAILS || secrets.ALLOWED_BETA_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh

