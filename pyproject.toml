[project]
name = "tt_video_editor"
version = "0.1.0"
description = "Table Tennis Highlights Automator"
authors = [
    {name = "Connie Huang"}
]
dependencies = [
    "opencv-python",
    "numpy",
    "scipy",
    "Pillow",
]

[project.scripts]
tt-automator = "tt_video_editor.core:main"
preview-scoreboard = "tt_video_editor.scoreboard.preview_scoreboard:create_preview"
create-proxy = "tt_video_editor.proxy:main"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
