[project]
name = "tt_video_editor"
version = "0.1.0"
description = "Table Tennis Highlights Automator"
authors = [
    {name = "Connie Huang"}
]
dependencies = [
    "opencv-python",
    "numpy",
    "scipy",
    "Pillow",
    "tqdm",
    "fastapi",
    "uvicorn",
    "pydantic",
    "shortuuid",
    "boto3",
    "python-multipart",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "torchvision",
]

[project.scripts]
tt-automator = "tt_video_editor.core:main"
tt-render = "tt_video_editor.render:main"
preview-scoreboard = "tt_video_editor.scoreboard.preview_scoreboard:create_preview"


[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
